[project]
name = "tooluse-pilot"
version = "0.4.0"
description = "Deterministic dual-mode tool-use benchmark pilot"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "openai>=1.50,<3"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
tooluse-pilot = "tooluse_pilot.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["tooluse_pilot*"]
