name: Python offline verification
on:
  push:
    branches:
      - feature/dynamic-w6-pilot
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Run offline unit and file integration tests
        run: python -m unittest discover -s tests -v
